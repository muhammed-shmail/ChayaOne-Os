appId: com.chayaone.desktop
productName: ChayaOne App
directories:
  output: dist-installers-v6
  buildResources: resources
files:
  - dist/**/*
  - resources/**/*
  - package.json
extraResources:
  - from: bundle/web-server
    to: web-server
    filter:
      - "**/*"
  - from: bundle/web-server/node_modules
    to: web-server/node_modules
    filter:
      - "**/*"
  - from: bundle/postgres
    to: postgres
    filter:
      - "**/*"
  - from: bundle/default-db
    to: default-db
    filter:
      - "**/*"
  - from: resources/icon.png
    to: icon.png
  - from: resources/icon.ico
    to: icon.ico
  - from: resources/splash.html
    to: splash.html
  - from: resources/bin
    to: bin
    filter:
      - "**/*"
win:
  target: nsis
  icon: resources/icon.ico
  legalTrademarks: "Nuro7"
nsis:
  oneClick: true
  perMachine: false
  allowToChangeInstallationDirectory: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: "ChayaOne"
  uninstallDisplayName: "ChayaOne OS"
  deleteAppDataOnUninstall: false
  runAfterFinish: true
